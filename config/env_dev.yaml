environment: dev
project_name: demo-app

release:
  approval_required: false

source:
# Required before enabling the Gitee webhook. When set, point directory at an empty managed path.
  repository: ""
  branch: main
  directory: app_dockerfile # e.g. .runtime/sources/demo-app for a remote repository
  dockerfile: Dockerfile

registry:
  address: localhost:5000
  repository: demo-app
  insecure: true

build:
  platform: linux/amd64
  pull_base_images: true
  pip_index_url: https://pypi.tuna.tsinghua.edu.cn/simple

compose:
  file: config/compose/docker-compose-dev.yml
  project_name: auto-deploy-dev
  service: web
  health_url: http://127.0.0.1:18080/health
  timeout: 150

k8s:
  namespace: auto-deploy-dev
  deployment_name: demo-app
  service_name: demo-app
  configmap_name: demo-app-config
  secret_name: ""
  container_name: demo-app
  service_account_name: demo-app
  container_port: 5000
  node_port: 30080
  replicas: 2
  timeout: 180
  health_url: http://127.0.0.1:30080/health
  templates:
    deployment: config/k8s-tpl/deployment.tpl.yaml
    service: config/k8s-tpl/service.tpl.yaml
    configmap: config/k8s-tpl/configmap.tpl.yaml

config_map:
  APP_ENV: dev
  LOG_LEVEL: DEBUG
  DEPENDENCY_CHECK_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: demo
  MYSQL_USER: demo

precheck:
  disk_threshold: 85
  network_target: http://127.0.0.1:5000/v2/
  required_free_ports: []
  check_docker: true

backup:
  mysql_container: auto-deploy-dev-mysql-1
  mysql_database: demo
  config_path: config
  retention_days: 14

alert:
  smtp_host_env: SMTP_HOST
  smtp_port_env: SMTP_PORT
  smtp_user_env: SMTP_USERNAME
  smtp_password_env: SMTP_PASSWORD
  smtp_starttls_env: SMTP_STARTTLS
  sender_env: ALERT_EMAIL_FROM
