apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${APP_NAME}
    app.kubernetes.io/managed-by: auto-deploy-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ${APP_NAME}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: ${NODE_PORT}

