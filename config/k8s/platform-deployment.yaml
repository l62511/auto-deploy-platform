apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-deploy-platform-worker
  namespace: auto-deploy-system
  labels:
    app.kubernetes.io/name: auto-deploy-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auto-deploy-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auto-deploy-platform
    spec:
      serviceAccountName: auto-deploy-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: auto-deploy-platform:local
          command: ["python", "-m", "src.worker"]
          envFrom:
            - secretRef:
                name: auto-deploy-platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
            - name: runtime
              mountPath: /app/.runtime
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: runtime
          emptyDir: {}
