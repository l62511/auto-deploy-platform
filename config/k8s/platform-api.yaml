apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-deploy-platform-api
  namespace: auto-deploy-system
  labels:
    app.kubernetes.io/name: auto-deploy-platform
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auto-deploy-platform
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auto-deploy-platform
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: auto-deploy-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: auto-deploy-platform:local
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - secretRef:
                name: auto-deploy-platform-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
            - name: runtime
              mountPath: /app/.runtime
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auto-deploy-platform
  namespace: auto-deploy-system
  labels:
    app.kubernetes.io/name: auto-deploy-platform
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: auto-deploy-platform
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 9000
      targetPort: http
