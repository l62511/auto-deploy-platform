apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auto-deploy-platform
  namespace: auto-deploy-system
  labels:
    app.kubernetes.io/name: auto-deploy-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auto-deploy-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
