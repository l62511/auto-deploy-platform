apiVersion: v1
kind: Secret
metadata:
  name: auto-deploy-platform-secrets
  namespace: auto-deploy-system
type: Opaque
stringData:
  PLATFORM_DATABASE_URL: postgresql+psycopg://deploy:replace-me@postgres:5432/auto_deploy
  PLATFORM_REDIS_URL: redis://redis:6379/0
  PLATFORM_HEALTH_TOKEN: replace-me
  JWT_SECRET: replace-me
  GITEE_WEBHOOK_TOKEN: replace-me
  PLATFORM_AUTO_CREATE_SCHEMA: "0"
  PLATFORM_REQUIRE_DURABLE: "1"
  AUTH_LOCAL_ENABLED: "0"
  AUTH_LOCAL_USERNAME: ""
  AUTH_LOCAL_PASSWORD: ""
  AUTH_LOCAL_ROLES: "operator"
  OIDC_ISSUER: "https://issuer.example.com/"
  OIDC_AUDIENCE: "auto-deploy-platform"
  OIDC_JWKS_URL: ""
  HOOK_ENV: "dev"
  HOOK_ENGINE: "k8s"
  PLATFORM_TASK_STALE_SECONDS: "3600"
