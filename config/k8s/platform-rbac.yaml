apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-deploy-platform
  namespace: auto-deploy-system
  labels:
    app.kubernetes.io/name: auto-deploy-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-deploy-platform
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auto-deploy-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: auto-deploy-platform
subjects:
  - kind: ServiceAccount
    name: auto-deploy-platform
    namespace: auto-deploy-system
