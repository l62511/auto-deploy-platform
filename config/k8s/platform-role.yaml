apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-deploy-platform-target
  namespace: auto-deploy-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-deploy-platform-target
  namespace: auto-deploy-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-deploy-platform-target
subjects:
  - kind: ServiceAccount
    name: auto-deploy-platform
    namespace: auto-deploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-deploy-platform-target
  namespace: auto-deploy-test
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-deploy-platform-target
  namespace: auto-deploy-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-deploy-platform-target
subjects:
  - kind: ServiceAccount
    name: auto-deploy-platform
    namespace: auto-deploy-system
